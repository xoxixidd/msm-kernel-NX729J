name: Build 7kimisu LKM for NX729J

# 用 7kimisu 的 kernel/ 源码 + 本机内核树(5.15.167) 编出 vermagic 匹配的 kernelsu.ko
# 产物：kernelsu.ko（配套 7kimisu v2.30 的 ksuinit 重新打包 init_boot）
#
# 为什么不用 7kimisu 官方 APK 里那个 .ko：
#   它是用 AOSP GKI 5.15.202 编的，vermagic = 5.15.202-android13-5.15.202_r00-dirty
#   本机内核是 5.15.167-android13-8-00017-gb1f32b310a30-ab12826353
#   且 CONFIG_MODULE_FORCE_LOAD 未设 → insmod 必报 Invalid module format

on:
  workflow_dispatch:
    inputs:
      sevenk_ref:
        description: '7kimisu 版本（tag/分支/提交）'
        required: false
        default: 'v2.30'
      custom_version:
        description: '内核版本串（必须与 uname -r 完全一致）'
        required: false
        default: '5.15.167-android13-8-00017-gb1f32b310a30-ab12826353'

env:
  TZ: Asia/Shanghai
  CLANG_VER: r450784d
  KBUILD_BUILD_TIMESTAMP: "Wed Apr  3 09:12:45 UTC 2024"

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 设置版本参数
        id: ver
        run: |
          set -e
          echo "BRANCH=nx729j-5.15.167" >> "$GITHUB_OUTPUT"
          KV="${{ inputs.custom_version }}"
          PREFIX="5.15.167"
          if [[ "$KV" != "$PREFIX"* ]]; then
            echo "::error::custom_version 必须以 $PREFIX 开头，当前是 $KV"
            exit 1
          fi
          SCM="${KV#"$PREFIX"}"
          echo "SCM_VER=$SCM" >> "$GITHUB_OUTPUT"
          echo "VERSION_FULL=$KV" >> "$GITHUB_OUTPUT"
          echo "版本串: $KV  (scm 后缀: $SCM)"
          echo "7kimisu ref: ${{ inputs.sevenk_ref }}"

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          ref: nx729j-5.15.167
          fetch-depth: 1
          path: kernel-tree

      - name: 版本串对齐（写 .scmversion）
        working-directory: kernel-tree
        run: |
          set -e
          SCM="${{ steps.ver.outputs.SCM_VER }}"
          if [ -n "$SCM" ]; then
            printf '%s' "$SCM" > .scmversion
            echo "写 .scmversion: $SCM"
          else
            rm -f .scmversion
            echo "无 scm 后缀"
          fi
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile

      - name: 检查工具链（不装包）
        run: |
          # 这步不跑 apt —— 本流程只编一个外部模块，不需要 pahole/BTF 那套。
          # runner 的 DNS 挂掉时 apt 必然失败，直接跳过。
          # 缺什么在下面编译步骤会明确报出来。
          echo "=== 现有工具 ==="
          MISSING=""
          for t in make gcc clang python3 git tar curl flex bison bc bzip2 lz4 zstd cpio; do
            printf '  %-10s ' "$t"
            if command -v "$t" >/dev/null 2>&1; then
              echo "OK"
            else
              echo "缺失"
              MISSING="$MISSING $t"
            fi
          done
          echo "=== 缺失清单:$MISSING ==="
          # flex / bison / bc 是编内核 scripts/dtc 和 Kconfig 的硬依赖
          for hard in flex bison bc; do
            echo "$MISSING" | grep -qw "$hard" && {
              echo "::error::缺少硬依赖 $hard —— 内核编译脚本需要它，且 runner 的 apt DNS 挂着装不上"
              exit 1
            }
          done
          echo "=== OPTIONAL（本流程不需要）==="
          command -v ccache >/dev/null 2>&1 && echo "  ccache   有（会加速）" || echo "  ccache   无（不影响）"
          command -v pahole >/dev/null 2>&1 && echo "  pahole   有" || echo "  pahole   无（不需要 BTF）"

      - name: 下载 AOSP clang
        run: |
          set -e
          echo "下载 clang-${CLANG_VER}..."
          mkdir -p clang
          curl -fL --retry 10 --retry-delay 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-13.0.0_r28/clang-${CLANG_VER}.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz
          clang/bin/clang --version | head -n1
          echo "CLANG_DIR=$PWD/clang/bin" >> "$GITHUB_ENV"

      - name: 克隆 7kimisu 源码
        run: |
          set -e
          REF="${{ inputs.sevenk_ref }}"
          git clone --quiet https://github.com/hartgerinktarcila-design/7kimisu KernelSU
          cd KernelSU
          if [ -n "$REF" ]; then
            git checkout --quiet "$REF" || { echo "::error::7kimisu 没有 ref: $REF"; exit 1; }
          fi
          echo "7kimisu 提交: $(git rev-parse --short=12 HEAD)"
          echo "版本: $(git describe --tags --always 2>/dev/null || echo unknown)"
          # 校验关键文件
          [ -f kernel/Kbuild ]   || { echo "::error::缺 kernel/Kbuild"; exit 1; }
          [ -f kernel/Makefile ] || { echo "::error::缺 kernel/Makefile"; exit 1; }
          [ -f kernel/Kconfig ]  || { echo "::error::缺 kernel/Kconfig"; exit 1; }
          ls kernel/ | head -20

      - name: 改 SELinux domain 名（ksu -> su）
        run: |
          set -e
          cd KernelSU
          sed -i 's/#define KERNEL_SU_DOMAIN "ksu"/#define KERNEL_SU_DOMAIN "su"/' kernel/selinux/selinux.h
          sed -i 's/#define KERNEL_SU_FILE "ksu_file"/#define KERNEL_SU_FILE "su_file"/' kernel/selinux/selinux.h
          grep -q '#define KERNEL_SU_DOMAIN "su"' kernel/selinux/selinux.h \
            || { echo "::error::domain 改名失败"; exit 1; }
          grep -q '#define KERNEL_SU_FILE "su_file"' kernel/selinux/selinux.h \
            || { echo "::error::file 改名失败"; exit 1; }
          echo "=== 改名结果 ==="
          grep -n 'KERNEL_SU_DOMAIN\|KERNEL_SU_FILE' kernel/selinux/selinux.h

      - name: 把 7kimisu 接到内核树
        run: |
          set -e
          cd kernel-tree
          # 原有软链接 drivers/kernelsu 指向 ../KernelSU/kernel
          # 我们换成指向上一层的 KernelSU（因为 clone 在 workspace 根）
          rm -f drivers/kernelsu
          ln -s ../../KernelSU/kernel drivers/kernelsu
          echo "=== 软链接 ==="
          ls -l drivers/kernelsu
          echo "=== 目标是否存在 ==="
          ls drivers/kernelsu/ | head -10
          echo "=== drivers/Makefile ==="
          grep kernelsu drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep kernelsu drivers/Makefile
          echo "=== drivers/Kconfig ==="
          grep kernelsu drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep kernelsu drivers/Kconfig

      - name: 合并 defconfig + 开启 CONFIG_KSU=m
        working-directory: kernel-tree
        run: |
          set -e
          export PATH="$CLANG_DIR:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          # 用 5.15.167 的 merge 模式配置（与 build-gki.yml 一致）
          if [ -f arch/arm64/configs/vendor/kalama-NX729J-gki_defconfig ]; then
            echo "用现成的 vendor/kalama-NX729J-gki_defconfig"
            make O=out ARCH=arm64 LLVM=1 vendor/kalama-NX729J-gki_defconfig
          else
            echo "没有现成 defconfig，用 gki_defconfig"
            make O=out ARCH=arm64 LLVM=1 gki_defconfig
          fi

          # 打开 KSU 模块模式
          ./scripts/config --file out/.config \
            -e MODULES \
            -m KSU \
            -e KSU_MANUAL_SU \
            -e KPROBES \
            -e KRETPROBES \
            -e HAVE_SYSCALL_TRACEPOINTS \
            -e MODULE_UNLOAD \
            -e KALLSYMS_ALL
          # SUSFS 在 7kimisu 里没有对应 Kconfig，跳过

          make O=out ARCH=arm64 LLVM=1 olddefconfig

          echo "=== 关键配置核验 ==="
          grep -E '^CONFIG_(KSU|MODULES|KPROBES|MODVERSIONS|MODULE_SIG_FORCE|MODULE_FORCE_LOAD)=' out/.config || true
          grep -q '^CONFIG_KSU=m' out/.config || { echo "::error::CONFIG_KSU 没设成 m"; grep KSU out/.config | head; exit 1; }

      - name: 编译内核（modules_prepare）
        working-directory: kernel-tree
        run: |
          export PATH="$CLANG_DIR:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"
          echo "=== modules_prepare ==="
          # 不用管道，直接落日志：管道会吃掉 make 的退出码，tail 还会截掉真错误
          if make O=out ARCH=arm64 LLVM=1 modules_prepare -j$(nproc) > /tmp/mp.log 2>&1; then
            echo "modules_prepare 成功"
          else
            RC=$?
            echo "::error::modules_prepare 失败（rc=$RC），错误尾部如下"
            grep -iE "error|错误|No such file|command not found|not found" /tmp/mp.log | tail -40 || true
            echo "──── 完整尾部 60 行 ────"
            tail -60 /tmp/mp.log
            exit 1
          fi
          echo "=== 本机 vermagic 期望值 ==="
          make O=out ARCH=arm64 LLVM=1 kernelrelease 2>/dev/null     || \
          cat out/include/config/kernel.release 2>/dev/null         || \
          echo "::error::取不到 kernelrelease"
          # modules_prepare 不会生成 Module.symvers，需要注意
          ls -l out/Module.symvers 2>/dev/null || echo "(没有 Module.symvers，外部模块可能报 undefined symbol)"

      - name: 编译 7kimisu 模块
        working-directory: KernelSU/kernel
        run: |
          set -e
          export PATH="$CLANG_DIR:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"
          KTREE="$GITHUB_WORKSPACE/kernel-tree"
          echo "=== 方案 A：7kimisu 自己的 Makefile（KDIR 指向内核树）==="
          if make KDIR="$KTREE" CONFIG_KSU=m CC="clang" -j$(nproc) > /tmp/mk.log 2>&1; then
            echo "方案 A 成功"
          else
            echo "方案 A 失败，尾部 40 行："
            tail -40 /tmp/mk.log || true
            echo ""
            echo "=== 方案 B：直接 kbuild（M= + O=）==="
            if make -C "$KTREE" M="$PWD" src="$PWD" O="$KTREE/out" \
                 ARCH=arm64 LLVM=1 CONFIG_KSU=m modules -j$(nproc) > /tmp/kb.log 2>&1; then
              echo "方案 B 成功"
            else
              echo "方案 B 也失败，尾部 40 行："
              tail -40 /tmp/kb.log || true
              echo "──── 方案A 的完整错误 ────"
              grep -iE "error|Error|No such|not found|undefined" /tmp/mk.log | tail -30 || true
              exit 1
            fi
          fi
          echo "=== 找产物 ==="
          find . -name "*.ko" 2>/dev/null | head -20
          echo "=== 内核树里的产物 ==="
          find "$KTREE/out" -name "kernelsu*" 2>/dev/null | head -10 || true

      - name: 校验 vermagic
        run: |
          set -e
          KO=$(find KernelSU -name "kernelsu.ko" | head -1)
          if [ -z "$KO" ]; then
            echo "::error::没找到 kernelsu.ko"
            find KernelSU -name "*.ko" | head
            exit 1
          fi
          echo "产物: $KO"
          ls -l "$KO"
          file "$KO"
          echo "=== vermagic ==="
          VM=$(strings -a "$KO" | grep -m1 '^vermagic=')
          echo "  $VM"
          WANT="5.15.167"
          if echo "$VM" | grep -q "$WANT"; then
            echo "  ✅ vermagic 含 $WANT"
          else
            echo "::error::vermagic 不含 $WANT —— 与内核不匹配，刷了也加载不了"
            exit 1
          fi
          echo "=== modinfo ==="
          strings -a "$KO" | grep -E '^(name|vermagic|srcversion|license|author|description)=' | head -10
          mkdir -p artifacts
          cp "$KO" artifacts/
          cp "$KO" "artifacts/kernelsu-$(echo $WANT)-aarch64.ko"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 7kimisu-lkm-5.15.167
          path: artifacts/*.ko
          if-no-files-found: error

      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7kimisu-lkm
          path: |
            kernel-tree/out/.config
          if-no-files-found: warn
